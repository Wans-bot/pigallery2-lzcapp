usage: pigallery2
application:
  subdomain: pigallery2
  health_check:
    test_url: http://pigallery2:80/
    disable: false
    start_period: 60s
    timeout: 5s
  upstreams:
    - location: /
      backend: http://pigallery2:80
  injects:
    # ── 免密登录 ────────────────────────────────────────────────────────────
    # pigallery2 首屏是 Angular 的登录表单（#form + #username + #password）。
    # 默认账号 admin/admin 由上游首次启动建库时生成；这里自动填好并提交，
    # 用户从桌面点进来直接落在画廊首页，不需要知道账号密码。
    # 注意：用户若在设置里改了密码，注入会失效（usage 里已写明不要改）。
    - id: pigallery2-autologin
      'on': browser
      auth_required: false
      when:
        - /*
      do:
        - src: |
            <script>
            (function () {
              var USER = 'admin', PASS = 'admin';
              var done = false;
              function submit() {
                var u = document.querySelector('#username');
                var pw = document.querySelector('#password');
                if (!u || !pw || done) return;
                done = true;
                var setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;
                setter.call(u, USER); u.dispatchEvent(new Event('input', { bubbles: true }));
                setter.call(pw, PASS); pw.dispatchEvent(new Event('input', { bubbles: true }));
                setTimeout(function () {
                  var f = document.querySelector('#form');
                  if (!f) return;
                  if (f.requestSubmit) f.requestSubmit();
                  else f.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
                }, 150);
              }
              function tick() { if (document.querySelector('#username')) submit(); }
              if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(tick, 300); });
              else setTimeout(tick, 300);
              new MutationObserver(tick).observe(document.documentElement, { childList: true, subtree: true });
            })();
            </script>
services:
  pigallery2:
    image: registry.lazycat.cloud/wans/bpatrik/pigallery2:714efccda897e235
    environment:
      - NODE_ENV=production
      - TZ=Asia/Shanghai
    # 声明 document.private 后，平台会自动把「应用文稿」挂成容器内的 /lzcapp/documents，
    # 不需要也不允许在这里再写 /lzcapp/documents 的 bind（会报 missing uid）。
    # pigallery2 默认扫描 /app/data/images；把应用「文档」目录软链过去，
    # 用户在微服文件里放进本应用文档的照片，就能直接被相册扫描到。
    setup_script: |
      mkdir -p /app/data/config /app/data/tmp
      if [ -d /lzcapp/documents ] && [ ! -L /app/data/images ]; then
        rm -rf /app/data/images
        ln -sfn /lzcapp/documents /app/data/images
      fi
    binds:
      - /lzcapp/var/pigallery2/config:/app/data/config
      - /lzcapp/var/pigallery2/db:/app/data/db
